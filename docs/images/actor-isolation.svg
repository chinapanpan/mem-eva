<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 870" width="1600" height="870">
<defs><style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#111827}.t{font-size:15px;font-weight:700}.s{font-size:13px;fill:#374151}.xs{font-size:12px;fill:#6b7280}.h{font-size:18px;font-weight:700}.sec{font-size:15px;font-weight:700;fill:#1f2937}.lb{font-size:12.5px}.mono{font-family:"Noto Sans Mono CJK SC",monospace;font-size:12px;fill:#1f2937}</style>
<marker id="mg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
<marker id="mb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="mo" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/></filter></defs>
<rect width="1600" height="870" fill="#ffffff"/>
<text x="800" y="42" class="h" text-anchor="middle">让用户只能访问自己的 actorId：两条调用路径</text>
<rect x="300" y="72" width="900" height="246" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="320" y="98" class="sec" text-anchor="start">路径一：业务后端确定性读写（A + B）</text>
<rect x="300" y="470" width="900" height="262" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="320" y="496" class="sec" text-anchor="start">路径二：Agent 运行中自主调用记忆工具（C）</text>
<path d="M 200,400 L 255,400 L 255,153 L 328,153" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#mg)"/>
<path d="M 255,400 L 255,575 L 328,575" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#mg)"/>
<path d="M 510,153 L 758,153" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#mg)"/>
<rect x="525.0" y="129" width="218" height="19" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="634" y="143" class="lb" text-anchor="middle" style="fill:#6b7280">从 JWT 推导 actorId，客户端不传</text>
<path d="M 870,188 L 870,230" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
<text x="884" y="214" class="lb" text-anchor="start" style="fill:#2563eb">session tag：actorId = 不透明 ID</text>
<path d="M 720,267 L 512,267" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
<rect x="597.5" y="245" width="37" height="19" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="616" y="259" class="lb" text-anchor="middle" style="fill:#2563eb">返回</text>
<path d="M 420,302 L 420,355 L 1248,355" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
<rect x="725.5" y="333" width="149" height="19" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="800" y="347" class="lb" text-anchor="middle" style="fill:#2563eb">业务后端携带该凭证调用</text>
<path d="M 880,420 L 1248,420" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#mo)"/>
<rect x="915.0" y="396" width="298" height="19" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="1064" y="410" class="lb" text-anchor="middle" style="fill:#ea580c">AccessDenied（实测 25/25 次越权尝试均被拒）</text>
<path d="M 580,575 L 718,575" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
<rect x="605.5" y="553" width="87" height="19" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="649" y="567" class="lb" text-anchor="middle" style="fill:#2563eb">调用记忆工具</text>
<path d="M 980,575 L 1110,575 L 1110,485 L 1248,485" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
<path d="M 850,610 L 850,644" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="3,3"/>
<path d="M 1410,230 L 1410,335" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="3,3"/>
<path d="M 1410,505 L 1410,560" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="3,3"/>
<rect x="40" y="350" width="160" height="100" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="120" cy="378" r="9" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<path d="M 104,404 Q 120,386 136,404" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<text x="120" y="430" class="t" text-anchor="middle">用户（已登录）</text>
<text x="120" y="474" class="lb" text-anchor="middle" style="fill:#6b7280">JWT（sub = 用户 ID）</text>
<rect x="330" y="118" width="180" height="70" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" filter="url(#sh)"/>
<text x="420.0" y="158.0" class="t" text-anchor="middle">业务后端</text>
<rect x="760" y="118" width="220" height="70" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" filter="url(#sh)"/>
<text x="870.0" y="148.0" class="t" text-anchor="middle">凭证签发</text>
<text x="870.0" y="170.0" class="xs" text-anchor="middle">（独立、最小权限）</text>
<rect x="720" y="232" width="300" height="70" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" filter="url(#sh)"/>
<text x="870.0" y="262.0" class="t" text-anchor="middle" style="fill:#1e40af">AWS STS</text>
<text x="870.0" y="284.0" class="s" text-anchor="middle">AssumeRole / AssumeRoleWithWebIdentity</text>
<rect x="330" y="232" width="180" height="70" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" filter="url(#sh)"/>
<text x="420.0" y="262.0" class="t" text-anchor="middle">短期凭证</text>
<text x="420.0" y="284.0" class="xs" text-anchor="middle">（按用户缓存）</text>
<rect x="560" y="395" width="320" height="50" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="720" y="425" class="s" text-anchor="middle" style="fill:#9a3412">攻击：用 bob 的 actorId / 路径 / 记录 ID</text>
<rect x="330" y="540" width="250" height="70" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" filter="url(#sh)"/>
<text x="455.0" y="570.0" class="t" text-anchor="middle" style="fill:#1e40af">AgentCore Runtime</text>
<text x="455.0" y="592.0" class="s" text-anchor="middle">（入站 JWT 认证）</text>
<rect x="720" y="540" width="260" height="70" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" filter="url(#sh)"/>
<text x="850.0" y="570.0" class="t" text-anchor="middle" style="fill:#1e40af">AgentCore Gateway</text>
<text x="850.0" y="592.0" class="s" text-anchor="middle">（Memory target）</text>
<rect x="640" y="644" width="420" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="850" y="668" class="t" text-anchor="middle" style="fill:#1e40af">Policy（Cedar）</text>
<text x="850" y="692" class="s" text-anchor="middle">actorId == JWT sub；namespacePath == JWT namespace</text>
<rect x="1250" y="80" width="320" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="1270" y="108" class="t" text-anchor="start">IAM 策略</text>
<line x1="1270" y1="120" x2="1550" y2="120" stroke="#e5e7eb" stroke-width="1"/>
<text x="1270" y="147" class="mono" text-anchor="start">actorId == ${aws:PrincipalTag/actorId}</text>
<text x="1270" y="175" class="mono" text-anchor="start">namespace / namespacePath 匹配 /u/${tag}/*</text>
<text x="1270" y="203" class="mono" text-anchor="start">显式 Deny：ListActors 等无条件键 API</text>
<rect x="1250" y="335" width="320" height="170" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" filter="url(#sh)"/>
<text x="1410" y="416" class="t" text-anchor="middle" style="fill:#1e40af">Amazon Bedrock</text>
<text x="1410" y="440" class="t" text-anchor="middle" style="fill:#1e40af">AgentCore Memory</text>
<rect x="1250" y="560" width="320" height="72" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="1410" y="590" class="s" text-anchor="middle">资源策略：只接受来自 Gateway 的请求</text>
<text x="1410" y="614" class="s" text-anchor="middle">（aws:SourceArn）</text>
<rect x="40" y="772" width="1520" height="62" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="60" y="808" class="t" text-anchor="start">前提</text>
<rect x="130" y="787" width="188" height="32" rx="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="224.0" y="808" class="s" text-anchor="middle">actorId 不透明、不含 /</text>
<rect x="342" y="787" width="177" height="32" rx="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="430.5" y="808" class="s" text-anchor="middle">标签从已验签 JWT 派生</text>
<rect x="543" y="787" width="225" height="32" rx="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="655.5" y="808" class="s" text-anchor="middle">记录类 API 始终带 namespace</text>
</svg>